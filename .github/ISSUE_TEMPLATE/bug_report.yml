name: Bug report
description: A handoff fails, is wrong, or the command misbehaves
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command you typed (for example `/session-handoff:handoff --haiku`) and what the session looked like.
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: handoff.log excerpt
      description: The relevant lines of `~/.claude/handoffs/handoff.log`, with private values (paths, names, project details) removed.
      render: text
